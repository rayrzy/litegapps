name: Build & Release LiteGapps (All Variants)

# Builds every listed litegapps variant (default: pixel through superlite)
# for one arch/sdk target and publishes the zips to GitHub Releases.
#
# Unlike build-release.yml (lite/superlite only, no addon needed), variants
# here have modules=true (pixel/micro/nano/basic/user/go/core) and need the
# packages/ addon tool. That is handled automatically now: lib/litegapps.sh's
# _litegapps_build_addon()/_litegapps_prep_modules() build packages/make and
# stage the result into core/litegapps/<variant>/modules/ on demand, so this
# workflow only needs to call build.sh restore/make like any other variant -
# no SourceForge credentials, no vps-build.sh.
#
# To build your own version: fork, adjust the variant list/arch/sdk inputs
# below (Actions tab -> "Build & Release LiteGapps (All Variants)" -> Run
# workflow), or push a tag like "full-v1".

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Comma-separated litegapps variants to build, in order"
        required: false
        default: "pixel,micro,nano,basic,user,go,core,lite,superlite"
      arch:
        description: "Architecture to build"
        required: false
        default: "arm64"
      sdk:
        description: "SDK/API level to build (must exist as <sdk>.zip / <sdk>-lite.zip on the gapps server, and as package/<arch>/<sdk>.zip for the addon)"
        required: false
        default: "36"
      tag:
        description: "Release tag (created if missing). Leave empty to auto-generate."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "full-v*"

permissions:
  contents: write

concurrency:
  group: build-release-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve variants/arch/sdk/tag/prerelease
        id: vars
        # Inputs and the tag name are user-controlled text. Passed through env
        # they stay plain data; pasted into the script with ${{ }} they would
        # be executed as shell. They are also validated below, because later
        # steps feed them to sed and to paths under core/.
        env:
          IN_VARIANTS: ${{ inputs.variants }}
          IN_ARCH: ${{ inputs.arch }}
          IN_SDK: ${{ inputs.sdk }}
          IN_TAG: ${{ inputs.tag }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VARIANTS="$IN_VARIANTS"
          [ -z "$VARIANTS" ] && VARIANTS="pixel,micro,nano,basic,user,go,core,lite,superlite"
          case "$VARIANTS" in
            *[!a-z,]*)
              echo "::error::variants must be lowercase names separated by commas"
              exit 1 ;;
          esac

          ARCH="$IN_ARCH"
          [ -z "$ARCH" ] && ARCH="arm64"
          case "$ARCH" in
            arm|arm64|x86|x86_64) ;;
            *) echo "::error::arch must be one of: arm arm64 x86 x86_64"; exit 1 ;;
          esac

          SDK="$IN_SDK"
          [ -z "$SDK" ] && SDK="36"
          case "$SDK" in
            *[!0-9]*) echo "::error::sdk must be a number"; exit 1 ;;
          esac

          # Android 7.0 (SDK 24) is the oldest target built.
          if [ "$SDK" -lt 24 ]; then
            echo "::error::Android 5.0-6.0 (SDK 21-23) are not supported any more; the oldest is Android 7.0 (SDK 24)"
            exit 1
          fi

          # x86 (32-bit) is supported up to Android 11 (SDK 30) only.
          if [ "$ARCH" = "x86" ] && [ "$SDK" -gt 30 ]; then
            echo "::error::x86 (32-bit) is not supported after Android 11 (SDK 30)"
            exit 1
          fi

          # arm (32-bit) is supported up to Android 16 (SDK 36) only.
          if [ "$ARCH" = "arm" ] && [ "$SDK" -gt 36 ]; then
            echo "::error::arm (32-bit) is not supported after Android 16 (SDK 36)"
            exit 1
          fi

          TAG="$IN_TAG"
          if [ -z "$TAG" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              TAG="$REF_NAME"
            else
              TAG="full-build-$(date +%Y%m%d)-$RUN_NUMBER"
            fi
          fi
          case "$TAG" in
            ""|*[!A-Za-z0-9._+-]*)
              echo "::error::release tag may only contain letters, digits and . _ + -"
              exit 1 ;;
          esac

          PRERELEASE="$IN_PRERELEASE"
          if [ -z "$PRERELEASE" ]; then
            if [ "$REF_TYPE" = "tag" ]; then PRERELEASE=false; else PRERELEASE=true; fi
          fi

          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Point every requested variant at arch/sdk
        env:
          ARCH: ${{ steps.vars.outputs.arch }}
          SDK: ${{ steps.vars.outputs.sdk }}
          VARIANTS: ${{ steps.vars.outputs.variants }}
        run: |
          for V in $(echo "$VARIANTS" | tr ',' ' '); do
            CFG="core/litegapps/$V/config"
            if [ -f "$CFG" ]; then
              sed -i "s/^arch=.*/arch=$ARCH/" "$CFG"
              sed -i "s/^sdk=.*/sdk=$SDK/" "$CFG"
              sed -i "s/^restore.arch=.*/restore.arch=$ARCH/" "$CFG"
              sed -i "s/^restore.sdk=.*/restore.sdk=$SDK/" "$CFG"
              echo "-- $CFG --"; grep -E "^(arch|sdk|restore\.(arch|sdk))=" "$CFG"
            else
              echo "! variant <$V> not found under core/litegapps/, skipping"
            fi
          done

      - name: Restore + build, one variant at a time (cleans gapps/modules between each - runner disk can't hold all 9 at once)
        env:
          ARCH: ${{ steps.vars.outputs.arch }}
          SDK: ${{ steps.vars.outputs.sdk }}
          VARIANTS: ${{ steps.vars.outputs.variants }}
        run: |
          set -e
          for V in $(echo "$VARIANTS" | tr ',' ' '); do
            echo "::group::$V"
            # restore just this variant's gapps (litegapps_restore() loops the
            # whole litegapps.restore list, so point it at one variant at a time)
            sed -i "s/^litegapps.restore=.*/litegapps.restore=$V/" config
            sh build.sh restore
            bash build.sh make litegapps "$V" "$ARCH" "$SDK"
            # packages/output is reused across variants at the same arch/sdk
            # (see lib/litegapps.sh's _litegapps_build_addon), so keep it -
            # only this variant's own gapps/modules/files and scratch dirs
            # are safe to drop before moving to the next one.
            rm -rf "core/litegapps/$V/gapps/$ARCH/$SDK"
            rm -rf "core/litegapps/$V/modules/$ARCH/$SDK"
            rm -rf "core/litegapps/$V/files/$ARCH/$SDK"
            rm -rf tmp tmp_files
            df -h .
            echo "::endgroup::"
          done
          # packages/ raw addon source is no longer needed once every
          # variant that uses it has staged its modules.
          rm -rf "packages/files/$ARCH/$SDK" "packages/zip-server/$ARCH/$SDK.zip" packages/output

      - name: Collect zips
        run: |
          find output -name "*.zip" -exec cp {} . \;
          ls -la ./*.zip
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
          ARCH: ${{ steps.vars.outputs.arch }}
          SDK: ${{ steps.vars.outputs.sdk }}
          VARIANTS: ${{ steps.vars.outputs.variants }}
          REPO: ${{ github.repository }}
        run: |
          NOTES="Automated LiteGapps build - arch: $ARCH, sdk: $SDK, variants: $VARIANTS"
          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip SHA256SUMS.txt --clobber --repo "$REPO"
          else
            gh release create "$TAG" ./*.zip SHA256SUMS.txt \
              --title "$TAG" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG \
              --repo "$REPO"
          fi

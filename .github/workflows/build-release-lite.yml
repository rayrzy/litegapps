name: Build & Release LiteGapps (lite matrix)

# Builds the "lite" variant across every SDK (29-36) x arch (arm, arm64,
# x86, x86_64) combination in parallel, and publishes every zip produced to
# a single GitHub Release. lite has modules=false (no packages/ addon
# needed), so each combination is a fast, independent build - if a given
# arch/sdk combo has no gapps on the server, that one job just produces no
# asset (fail-fast: false keeps the rest of the matrix going).
#
# superlite is not built here - it's covered by build-release-full.yml
# (single arch/sdk target, all variants).
#
# Run manually from the Actions tab, or push a tag like "lite-v1".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created if missing). Leave empty to auto-generate."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "lite-v*"

permissions:
  contents: write

concurrency:
  group: build-release-lite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        sdk: [29, 30, 31, 32, 33, 34, 35, 36]
        arch: [arm, arm64, x86, x86_64]
        # x86 (32-bit) is supported up to Android 11 (SDK 30) only; arm
        # (32-bit) up to Android 16 (SDK 36), which is already the matrix top.
        exclude:
          - { arch: x86, sdk: 31 }
          - { arch: x86, sdk: 32 }
          - { arch: x86, sdk: 33 }
          - { arch: x86, sdk: 34 }
          - { arch: x86, sdk: 35 }
          - { arch: x86, sdk: 36 }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point lite at ${{ matrix.arch }}/${{ matrix.sdk }}
        run: |
          CFG="core/litegapps/lite/config"
          sed -i "s/^arch=.*/arch=${{ matrix.arch }}/" "$CFG"
          sed -i "s/^sdk=.*/sdk=${{ matrix.sdk }}/" "$CFG"
          sed -i "s/^restore.arch=.*/restore.arch=${{ matrix.arch }}/" "$CFG"
          sed -i "s/^restore.sdk=.*/restore.sdk=${{ matrix.sdk }}/" "$CFG"
          sed -i "s/^litegapps.restore=.*/litegapps.restore=lite/" config

      - name: Restore + build (skip if this arch/sdk has no gapps on the server)
        run: |
          # build.sh restore exits 1 both when the gapps are not on the server
          # and when the download itself failed, so the two cannot be told
          # apart here. Skipping is still right for the first case, so skip -
          # but as a visible warning on the run page, not a silent green job.
          if ! sh build.sh restore; then
            echo "::warning title=Skipped ${{ matrix.arch }}/${{ matrix.sdk }}::restore failed (no gapps on the server, or a download error) - check this job's log if you expected a build"
            exit 0
          fi
          # Restore worked, so from here a failure is a real build failure and
          # must fail the job instead of being swallowed.
          bash build.sh make litegapps lite "${{ matrix.arch }}" "${{ matrix.sdk }}"
          # flatten into dist/ - upload-artifact preserves the glob's parent
          # dirs (the date folder), which would nest zips on download instead
          # of landing them flat next to each other.
          mkdir -p dist
          find output -name "*.zip" -exec cp {} dist/ \;
          if ! ls dist/*.zip >/dev/null 2>&1; then
            echo "::error title=No zip ${{ matrix.arch }}/${{ matrix.sdk }}::the build finished but produced no zip"
            exit 1
          fi

      - name: Upload zip (if any was produced)
        uses: actions/upload-artifact@v4
        with:
          name: lite-${{ matrix.arch }}-${{ matrix.sdk }}
          path: dist/*.zip
          if-no-files-found: ignore
          retention-days: 1

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag/prerelease
        id: vars
        # Inputs and the tag name are user-controlled text. Passed through env
        # they stay plain data; pasted into the script with ${{ }} they would
        # be executed as shell.
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="$IN_TAG"
          if [ -z "$TAG" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              TAG="$REF_NAME"
            else
              TAG="lite-build-$(date +%Y%m%d)-$RUN_NUMBER"
            fi
          fi
          case "$TAG" in
            ""|*[!A-Za-z0-9._+-]*)
              echo "::error::release tag may only contain letters, digits and . _ + -"
              exit 1 ;;
          esac
          PRERELEASE="$IN_PRERELEASE"
          if [ -z "$PRERELEASE" ]; then
            if [ "$REF_TYPE" = "tag" ]; then PRERELEASE=false; else PRERELEASE=true; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download every combination's zip
        uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: lite-*
          merge-multiple: true

      - name: Prepare release assets
        run: |
          ls -la collected/ 2>/dev/null || true
          if [ -z "$(ls -A collected 2>/dev/null)" ]; then
            echo "! No zips were produced for any arch/sdk combination"
            exit 1
          fi
          cd collected && sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          NOTES="Automated LiteGapps lite build - SDK 29-36 x arm/arm64/x86_64, x86 up to SDK 30"
          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"
          cd collected
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" *.zip SHA256SUMS.txt --clobber --repo "$REPO"
          else
            gh release create "$TAG" *.zip SHA256SUMS.txt \
              --title "$TAG" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG \
              --repo "$REPO"
          fi

name: CI

# Quality checks on every push to main and every pull request. The release
# workflows (build-release-*.yml) build and publish; this one never does, and
# needs no secrets and no access to SourceForge.
#
# Blocking steps are the ones that pass on the tree today. The two marked
# "advisory" report problems without failing the run: they have not been run
# against this tree in CI yet, and a check that is red from the first commit
# trains people to ignore it. Once one has passed on main, delete its
# `continue-on-error` line to make it blocking.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n for bash scripts, sh -n for the rest)
        run: |
          # build.sh and lib/ are plain POSIX sh (dash on this runner is the
          # strict check); scripts whose shebang names bash are checked as bash.
          status=0
          for f in $(git ls-files '*.sh' packages/make); do
            if head -n 1 "$f" | grep -q bash; then shell=bash; else shell=sh; fi
            if ! "$shell" -n "$f"; then
              echo "::error file=$f::syntax error ($shell -n)"
              status=1
            fi
          done
          exit $status

      - name: Tests for build.sh (fake scp, never contacts SourceForge)
        run: sh tests/build-sh.test.sh

      - name: ShellCheck, errors only (advisory)
        continue-on-error: true
        run: |
          # The scripts predate ShellCheck and leave most variables unquoted on
          # purpose, so only error-level findings are reported.
          status=0
          for f in $(git ls-files '*.sh' packages/make); do
            if head -n 1 "$f" | grep -q bash; then shell=bash; else shell=sh; fi
            shellcheck --severity=error --shell="$shell" --format=gcc "$f" || status=1
          done
          exit $status

  web:
    name: Web panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests load the real source with Node's own TypeScript support and
      # need no dependencies, so they run before (and without) npm ci.
      - name: Unit tests
        run: npm test

      - name: Install dependencies
        run: npm ci

      - name: Type check (advisory)
        continue-on-error: true
        run: |
          # next-env.d.ts is generated by next dev/build and gitignored, but the
          # type check needs it for Next's ambient types.
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          npm run typecheck
